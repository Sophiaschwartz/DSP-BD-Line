<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F4F0FA; --surface:#FFFFFF; --surface2:#EDE6F7; --ink:#1A0F2E; --muted:#6A5C86; --line:#D9CFEA;

:root[data-theme="dark"]{

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px);-webkit-text-size-adjust:100%}

button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--royal)}

.panel+.panel{margin-top:12px}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}

.hero{display:grid;gap:22px;grid-template-columns:1fr;margin-top:4px}
.hero h1{font-size:clamp(40px,9vw,72px);color:var(--royal)}

:root[data-theme="dark"] .hero h1{color:var(--accent)}

.ringbtn text{font:400 17px var(--display);fill:var(--ink)}
.ringbtn.full circle.fill{fill:var(--gold)}

.ringbtn.me small{color:var(--royal);text-decoration:underline;text-underline-offset:3px}

button.btn.danger.armed{background:var(--warn);color:#fff;border-color:var(--warn)}

textarea{min-height:76px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}

.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:2px solid var(--line)}

.scroll{overflow-x:auto}
.leader{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.leader:last-child{border-bottom:0}
.leader .role{font-weight:700}
.leader select{width:auto;max-width:190px}
.purpose{font:400 20px/1.55 var(--display);max-width:60ch}
.purpose-wrap{border-left:5px solid var(--gold);padding-left:18px}
.note{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;margin-bottom:12px}
.note.pin{border-color:var(--gold);box-shadow:inset 4px 0 0 var(--gold)}
.note p{white-space:pre-wrap;margin:6px 0}
.day{display:grid;grid-template-columns:54px 1fr;gap:8px;align-items:start;margin-bottom:8px}
.day b{padding-top:9px;color:var(--royal)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .day b{color:var(--accent)}}
:root[data-theme="dark"] .day b{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:90vw}
.empty{color:var(--muted);padding:14px 0}
.wkgrid{display:grid;gap:10px;grid-template-columns:1fr}
.wkday{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:90px}
.wkday.today{border:2px solid var(--gold)}
.wkhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.wkhead b{font:400 18px var(--display)}
.wkhead span{color:var(--muted);font-size:13px}
.wknote{font-size:12px;font-weight:600;margin-bottom:4px}
.wkev{border-left:4px solid var(--line);padding:3px 0 3px 8px;margin-top:6px}
.wkev.must{border-left-color:var(--gold)}
.wkempty{font-size:13px}
@media (min-width:760px){.wkgrid{grid-template-columns:repeat(7,minmax(0,1fr))}.wkhead{flex-direction:column;align-items:flex-start}.wkev b{font-size:14px}}
.calwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.cal{display:grid;grid-template-columns:50px repeat(7,minmax(92px,1fr));min-width:720px}
.calh{position:sticky;top:0;padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface2)}
.calh b{display:block;font:400 16px var(--display)}
.calh span{font-size:12px;color:var(--muted)}
.calh.today{background:var(--gold);color:#2A1158}
.calh.today span{color:#2A1158}
.calh:first-child,.caltime{border-left:0}
.calad{padding:4px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);font-size:11px;color:var(--muted);min-height:30px;display:flex;flex-direction:column;gap:3px}
.calad:first-of-type{border-left:0}
.calchip{text-align:left;border:0;border-left:4px solid var(--line);border-radius:4px;padding:2px 5px;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer}
.caltime{position:relative}
.calhr{height:44px;font-size:11px;color:var(--muted);padding:0 6px;text-align:right;box-sizing:border-box;border-top:1px solid var(--line)}
.calcol{position:relative;border-left:1px solid var(--line);height:792px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 43px,var(--line) 43px,var(--line) 44px)}
.calblk{position:absolute;overflow:hidden;text-align:left;border:0;border-left:4px solid var(--line);border-radius:6px;padding:2px 5px;color:var(--ink);cursor:pointer;line-height:1.2;box-sizing:border-box}
.calblk b{display:block;font-size:12px;font-weight:700}
.calblk span{display:block;font-size:11px;color:var(--muted)}
.calnow{position:absolute;left:0;right:0;height:2px;background:#E5484D;z-index:2}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
@media (min-width:860px){.hero{grid-template-columns:5fr 6fr;align-items:center}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

(function(){

 {id:'market',name:'Market Analyst',area:'Finance',desc:'Research a high-performing or promising stock. Create a clean, concise one-pager detailing why it\u2019s a good buy (look at recent news, P/E ratio, or market trends).',out:'A PDF one-pager, emailed'},

var DAYS=[['mon','Mon'],['tue','Tue'],['wed','Wed'],['thu','Thu'],['fri','Fri'],['sat','Sat'],['sun','Sun']];

var FB_CONFIG={apiKey:"AIzaSyCVXjR8ceKi7VDyxV7HQev9gIb2YoLfdlo",authDomain:"bdline-265db.firebaseapp.com",projectId:"bdline-265db",storageBucket:"bdline-265db.firebasestorage.app",messagingSenderId:"643277623258",appId:"1:643277623258:web:07f0d9766a76057cd8bae3"};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(id){return document.getElementById(id)}
function toast(msg){var t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true},3600)}
function parseDate(s){var p=String(s||'').split('-');return p.length===3?new Date(+p[0],+p[1]-1,+p[2]):null}
function fmtDate(s){var d=parseDate(s);return d?d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}):''}
function daysUntil(s){var d=parseDate(s);if(!d)return null;var n=new Date();n=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.round((d-n)/86400000)}
function rel(n){return n===null?'':n<0?Math.abs(n)+(Math.abs(n)===1?' day ago':' days ago'):n===0?'today':n===1?'tomorrow':'in '+n+' days'}
function nm(id){return BYID[id]?BYID[id].name:(id||'')}

  function c(h,mi,a){if(a==='pm'&&h<12)h+=12;if(a==='am'&&h===12)h=0;return h*60+mi}
  var s=c(+m[1],+(m[2]||0),sa),e=c(+m[4],+(m[5]||0),ea);
  if(e<=s&&inh)s-=720;

function calItems(iso,dow){

    var r=(e.start&&e.end&&hm(e.start)!==null)?[hm(e.start),hm(e.end)]:parseRange(e.time);
    out.push({kind:'ev',id:k,title:e.title,cat:e.cat||(e.must?'dsp':'event'),s:r?r[0]:null,e:r?r[1]:null,who:'shared'});
  });

    if(who!=='all'&&b.owner!==who)return;

function layoutCols(list){
  list.sort(function(a,b){return a.s-b.s||b.e-a.e});
  var cluster=[],end=-1,colEnds=[];
  function flush(){var n=0;cluster.forEach(function(i){if(i.col+1>n)n=i.col+1});cluster.forEach(function(i){i.n=n});cluster=[]}
  list.forEach(function(i){
    if(cluster.length&&i.s>=end){flush();colEnds=[];end=-1}
    var c=0;while(colEnds[c]!==undefined&&colEnds[c]>i.s)c++;
    colEnds[c]=i.e;i.col=c;cluster.push(i);end=Math.max(end,i.e);
  });
  if(cluster.length)flush();
}

  else if(a==='delev'){arm('e'+el.dataset.id,function(){del('events/'+el.dataset.id)})}
  else if(a==='delnote'){arm('n'+el.dataset.id,function(){del('notes/'+el.dataset.id)})}
  else if(a==='pinnote'){var n=D.notes[el.dataset.id]||{};patch('notes/'+el.dataset.id,{pin:!n.pin})}
  else if(a==='addtask'){var t=$('newTask').value.trim();if(!t){toast('Type a task first.');return}put('tasks/t'+Date.now(),{text:t,due:$('newTaskDue').value||'',done:false,ts:Date.now()}).then(function(){})}
  else if(a==='addev'){var tt=$('evT').value.trim(),dd=$('evD').value;if(!tt||!dd){toast('Add a title and a date.');return}put('events/e'+Date.now(),{title:tt,date:dd,time:$('evTime').value.trim(),place:$('evP').value.trim(),note:$('evN').value.trim(),must:$('evM').checked})}
  else if(a==='addnote'){var nt=$('nT').value.trim(),nb=$('nB').value.trim(),nl=$('nL').value.trim();if(!nt&&!nb){toast('Add a title or some text.');return}put('notes/n'+Date.now(),{title:nt,body:nb,link:nl,author:me?BYID[me].name:'Guest',pin:$('nP').checked,ts:Date.now()}).then(function(){S.page='notes';render()})}
  else if(a==='addweek'){
    var num=parseInt($('wkNum').value,10),due=$('wkDue').value,lines=$('wkList').value.split('\n').map(function(l){return l.trim()}).filter(Boolean);
    if(!(num>=2)||!lines.length){toast('Enter a week number (2 or higher) and at least one brother.');return}
    var list=lines.map(function(l){var p=l.split(',');return [p[0].trim(),(p[1]||'').trim()]});
    put('weeks/w'+num,{label:'Week '+num,due:due,list:list}).then(function(){S.week='w'+num;render()});
  }
  else if(a==='addmw'){
    var mn=parseInt($('mwNum').value,10),md=$('mwDue').value,ml=$('mwList').value.split('\n').map(function(l){return l.trim()}).filter(Boolean);
    if(!(mn>=2)||!ml.length){toast('Enter a week number (2 or higher) and at least one group.');return}
    var groups=ml.map(function(l){return l.split(',').map(function(x){x=x.trim();var s=slug(x);if(BYID[s])return s;var f=ROSTER.filter(function(r){return r.first.toLowerCase()===x.toLowerCase()});return f.length===1?f[0].id:x}).filter(Boolean)});
    put('mingleweeks/w'+mn,{label:'Mingle Week '+mn,due:md,groups:groups}).then(function(){S.mingleWeek='w'+mn;render()});
  }
  else if(a==='draw'){
    var wkn=el.dataset.w,already=assignedAll();
    var pool=ROSTER.filter(function(m){return !already[m.id]}).map(function(m){return m.id});
    for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=pool[i];pool[i]=pool[j];pool[j]=tmp}
    var picks=pool.slice(0,5),ids=JOBS.map(function(j){return j.id});
    for(var k=ids.length-1;k>0;k--){var r=Math.floor(Math.random()*(k+1));var t2=ids[k];ids[k]=ids[r];ids[r]=t2}
    var assign={};ids.forEach(function(jid,idx){assign[jid]=picks[idx]||''});
    put('jobs/'+wkn,{assign:assign,done:{},link:{},drawn:Date.now()}).then(function(){S.jobWeek=wkn;render()});
  }
});
function edSync(el){
  if(!S.ed||!el.dataset)return false;
  if(el.dataset.ed){var f=el.dataset.ed;S.ed[f]=el.type==='checkbox'?el.checked:el.value;return f}
  if(el.dataset.edday!==undefined){var d=+el.dataset.edday,ix=S.ed.days.indexOf(d);if(el.checked&&ix<0)S.ed.days.push(d);if(!el.checked&&ix>=0)S.ed.days.splice(ix,1);return 'day'}
  return false;
}
document.addEventListener('input',function(ev){edSync(ev.target)});
document.addEventListener('change',function(ev){
  var el=ev.target;
  var ef=edSync(el);
  if(ef){if(ef==='owner'||ef==='rep'){if(S.ed.owner==='shared')S.ed.rep=false;render()}return}
  if(el.id==='me'){me=el.value||null;try{if(me)localStorage.setItem('bd_me',me);else localStorage.removeItem('bd_me')}catch(e){}S.chatMember=me;render();return}
  var c=el.dataset&&el.dataset.change;if(!c)return;

  else if(c==='task')patch('tasks/'+el.dataset.id,{done:el.checked});
  else if(c==='chat'){var o={chats:{}};o.chats[S.week]={};o.chats[S.week][el.dataset.b]=el.checked?now:0;mpatch(el.dataset.m,o)}
  else if(c==='quiz'){var q={quiz:{}};q.quiz[S.quizWeek]={done:el.checked};mpatch(el.dataset.m,q)}
  else if(c==='mission')mpatch(el.dataset.m,{mission:el.checked?now:0});
  else if(c==='leader'){var L=Object.assign({},(function(){var x={};ROLES.forEach(function(r){x[r[0]]=r[2]});return x})(),D.leaders.main||{});L[el.dataset.role]=el.value;put('leaders/main',L)}
  else if(c==='jassign'){var a2={assign:{}};a2.assign[el.dataset.j]=el.value;patch('jobs/'+S.jobWeek,a2)}
  else if(c==='jdone'){var d2={done:{}};d2.done[el.dataset.j]=el.checked?now:0;patch('jobs/'+S.jobWeek,d2)}
  else if(c==='mingle')patch('mingles/'+el.dataset.k,{done:el.checked?now:0});
});
document.addEventListener('focusout',function(ev){
  var el=ev.target,b=el.dataset&&el.dataset.blur;
  if(b){
    if(b==='score'){var q={quiz:{}};q.quiz[S.quizWeek]={score:el.value.trim()};var cur=((mdata(el.dataset.m).quiz||{})[S.quizWeek]||{}).score||'';if(el.value.trim()!==cur)mpatch(el.dataset.m,q)}
    else if(b==='bio'){if(el.value!==(mdata(el.dataset.m).bio||''))mpatch(el.dataset.m,{bio:el.value})}
    else if(b==='sched'){var s={schedule:{}};s.schedule[el.dataset.d]=el.value;if(el.value!==(((mdata(el.dataset.m).schedule)||{})[el.dataset.d]||''))mpatch(el.dataset.m,s)}
    else if(b==='jlink'){var l={link:{}};l.link[el.dataset.j]=el.value.trim();patch('jobs/'+S.jobWeek,l)}
    else if(b==='mnote'){var cn=(D.mingles[el.dataset.k]||{}).note||'';if(el.value!==cn)patch('mingles/'+el.dataset.k,{note:el.value})}
    else if(b==='res'){var r={};r[el.dataset.f]=el.value;patch('resource/'+el.dataset.id,r)}
  }
  if(pending)setTimeout(function(){var a=document.activeElement;if(!(a&&$('app').contains(a)&&/INPUT|TEXTAREA/.test(a.tagName)))render()},60);
});

/* ---------- live data (Firebase) ---------- */
function flat(o,pre,out){Object.keys(o).forEach(function(k){var v=o[k],p=pre.concat(k);if(v&&typeof v==='object'&&!Array.isArray(v)&&Object.keys(v).length)flat(v,p,out);else out.push([p,v])});return out}
function mkDb(fs){
  var base='s/'+PASS+'/';
  return {
    collection:function(n){return fs.collection(base+n)},
    doc:function(p){var r=fs.doc(base+p);return {
      set:function(o){return r.set(o)},
      delete:function(){return r.delete()},
      update:function(o){
        var fl=flat(o,[],[]),args=[];if(!fl.length)return Promise.resolve();
        fl.forEach(function(x){args.push(new firebase.firestore.FieldPath(...x[0]),x[1])});
        return r.update.apply(r,args).catch(function(e){if(e&&e.code==='not-found'){var er=new Error('missing');er.code='invalid_argument';throw er}throw e});
      }
    }}
  };
}
var subscribed=false;
function lockOut(){
  AUTH.denied=true;PASS=null;db=null;subscribed=false;LOADED={};
  try{localStorage.removeItem('bd_pass')}catch(e){}
  render();
}
function subscribe(){
  if(subscribed)return;subscribed=true;
  Object.keys(D).forEach(function(name){
    db.collection(name).onSnapshot(function(snap){
      var o={};snap.docs.forEach(function(d){o[d.id]=d.data()});D[name]=o;LOADED[name]=true;sched();
    },function(e){
      console.error(name,e);
      if(e&&e.code==='permission-denied'&&PASS)lockOut();
    });
  });
}
function startSession(){
  db=mkDb(firebase.firestore());canWrite=true;subscribed=false;LOADED={};
  subscribe();render();
}
document.addEventListener('keydown',function(ev){
  if(ev.key==='Enter'&&ev.target&&ev.target.id==='gatePass'){var b=document.querySelector('[data-act="unlock"]');if(b)b.click()}
});
function init(){
  render();
  if(!configured())return;
  try{firebase.initializeApp(FB_CONFIG)}catch(e){}
  var p=null;try{p=localStorage.getItem('bd_pass')}catch(e){}
  if(p){PASS=p;startSession()}
}
init();
})();
